<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNN Portal — База контрактов</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cnn: { bg: '#121214', panel: '#1c1c21', border: '#26262e', orange: '#ff6b00', orangeHover: '#e66000' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #121214; color: #e4e4e7; font-family: 'Inter', sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .spoiler-content { display: none; }
        .spoiler-content.open { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-sm">

    <!-- Шапка -->
    <header class="h-16 px-6 border-b border-cnn-border bg-cnn-panel flex items-center justify-between shrink-0 sticky top-0 z-40">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-cnn-orange flex items-center justify-center font-bold text-white tracking-tighter">CNN</div>
            <span class="text-lg font-bold text-white tracking-wide">PORTAL</span>
        </div>
        <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-[#121214] border border-cnn-border text-gray-400 text-xs font-medium">
            База контрактов
        </div>
    </header>

    <!-- Основная рабочая область -->
    <main class="flex-1 overflow-auto p-4 md:p-6 hide-scrollbar">
        <div class="space-y-6 max-w-5xl mx-auto">
            
            <!-- Форма добавления -->
            <div class="bg-cnn-panel border border-cnn-border rounded-xl p-5 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-white font-bold flex items-center gap-2 text-base">
                        <i data-lucide="plus-circle" class="w-5 h-5 text-cnn-orange"></i> Добавить новый контракт
                    </h2>
                    <button onclick="toggleImportModal()" class="text-xs bg-[#26262e] hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-2 shadow-md border border-[#32323d]">
                        <i data-lucide="table" class="w-4 h-4 text-green-400"></i> Импорт из Google Таблиц
                    </button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
                    <div class="md:col-span-9 lg:col-span-10">
                        <input type="text" id="add-code" class="w-full bg-cnn-bg border border-cnn-border rounded-lg px-4 py-3 text-white focus:border-cnn-orange outline-none transition-colors font-bold uppercase" placeholder="Кодовое слово (например: АЗС)">
                    </div>
                    <div class="md:col-span-3 lg:col-span-2">
                        <button onclick="createNewContract()" class="w-full h-full min-h-[48px] bg-cnn-orange hover:bg-cnn-orangeHover text-white font-bold rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg shadow-orange-900/20">
                            <i data-lucide="check" class="w-5 h-5"></i> Создать
                        </button>
                    </div>

                    <div class="md:col-span-12">
                        <textarea id="add-text" rows="2" class="w-full bg-cnn-bg border border-cnn-border rounded-lg px-4 py-3 text-white focus:border-cnn-orange outline-none transition-colors resize-none" placeholder="Полный текст контракта для копирования в эфир..."></textarea>
                    </div>
                </div>
            </div>

            <!-- Поиск -->
            <div class="relative">
                <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-500"></i>
                <input type="text" id="search-code" oninput="renderContractsList()" class="w-full bg-cnn-panel border border-cnn-border rounded-xl pl-12 pr-4 py-3.5 text-white focus:border-cnn-orange outline-none transition-colors shadow-lg" placeholder="Поиск по кодовому слову...">
            </div>

            <!-- Список контрактов -->
            <div id="contracts-container" class="space-y-3"></div>
        </div>
    </main>

    <!-- Модальное окно Импорта -->
    <div id="import-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4 transition-opacity">
        <div class="bg-cnn-panel border border-cnn-border rounded-xl w-full max-w-lg p-6 shadow-2xl relative">
            <button onclick="toggleImportModal()" class="absolute top-4 right-4 text-gray-500 hover:text-white transition-colors"><i data-lucide="x" class="w-5 h-5"></i></button>
            
            <h3 class="text-xl font-bold text-white mb-3 flex items-center gap-2">
                <i data-lucide="table" class="text-green-500 w-6 h-6"></i> Импорт из таблицы
            </h3>
            
            <div class="text-sm text-gray-400 mb-5 leading-relaxed space-y-2">
                <p>Вставьте ссылку на вашу Google Таблицу.</p>
                <p class="text-yellow-500 bg-yellow-500/10 p-2 rounded border border-yellow-500/20">
                    <b class="text-yellow-400">Внимание:</b> В настройках доступа к таблице обязательно выберите <b>«Все, у кого есть ссылка»</b>.
                </p>
                <p>Алгоритм автоматически вытащит:<br>
                   • <b>Столбец B</b> — Кодовое слово<br>
                   • <b>Столбец O</b> — Текст рекламы
                </p>
            </div>
            
            <input type="text" id="sheet-url" class="w-full bg-[#121214] border border-cnn-border rounded-lg px-4 py-3 text-white focus:border-cnn-orange outline-none transition-colors mb-4" placeholder="https://docs.google.com/spreadsheets/d/...">
            
            <button id="import-btn" onclick="startImport()" class="w-full h-[48px] bg-green-600 hover:bg-green-500 text-white font-bold rounded-lg transition-colors flex items-center justify-center gap-2 shadow-lg">
                <i data-lucide="download" class="w-5 h-5"></i> Начать импорт
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderContractsList();
            if (typeof lucide !== 'undefined') lucide.createIcons();
        });

        // --- РАБОТА С КОНТРАКТАМИ ---
        function getSavedContracts() {
            return JSON.parse(localStorage.getItem('cnn_pure_contracts') || '[]');
        }

        function saveContractsDb(arr) {
            localStorage.setItem('cnn_pure_contracts', JSON.stringify(arr));
            renderContractsList();
        }

        function createNewContract() {
            const code = document.getElementById('add-code').value.trim();
            const text = document.getElementById('add-text').value.trim();

            if (!code || !text) {
                alert("Заполните кодовое слово и текст контракта!");
                return;
            }

            let db = getSavedContracts();
            db.push({ id: Date.now(), code, text });
            saveContractsDb(db);

            document.getElementById('add-code').value = '';
            document.getElementById('add-text').value = '';
        }

        function deleteContractRow(id) {
            if (confirm("Вы действительно хотите удалить этот контракт?")) {
                let db = getSavedContracts().filter(c => c.id !== id);
                saveContractsDb(db);
            }
        }

        function toggleSpoilerRow(id) {
            const el = document.getElementById('spoiler-' + id);
            if(el) el.classList.toggle('open');
        }

        function copyRawText(text, event) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            
            const btn = event.currentTarget;
            const origHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="check-circle" class="w-4 h-4 text-green-400 mx-auto"></i>';
            if (typeof lucide !== 'undefined') lucide.createIcons();
            setTimeout(() => { 
                btn.innerHTML = origHTML; 
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }, 1000);
        }

        function renderContractsList() {
            const container = document.getElementById('contracts-container');
            let db = getSavedContracts();
            
            const searchQuery = document.getElementById('search-code').value.trim().toLowerCase();

            if (searchQuery) {
                db = db.filter(c => String(c.code).toLowerCase().includes(searchQuery));
            }

            if(db.length === 0) {
                if (searchQuery) {
                    container.innerHTML = '<div class="text-center py-16 text-gray-500 bg-cnn-panel rounded-xl border border-cnn-border">По вашему запросу ничего не найдено.</div>';
                } else {
                    container.innerHTML = '<div class="text-center py-16 text-gray-500 bg-cnn-panel rounded-xl border border-cnn-border">База контрактов пуста. Добавьте первый контракт выше или импортируйте из Google Таблиц.</div>';
                }
                return;
            }

            let html = '';
            db.sort((a, b) => b.id - a.id).forEach(c => {
                const safeText = String(c.text).replace(/"/g, '&quot;').replace(/'/g, "\\'");
                const safeCode = String(c.code).replace(/"/g, '&quot;').replace(/'/g, "\\'");

                html += `
                <div class="bg-cnn-panel border border-cnn-border rounded-xl overflow-hidden transition-all hover:border-gray-700">
                    <div class="p-4 flex flex-wrap items-center justify-between gap-4">
                        
                        <!-- Левая часть -->
                        <div class="flex items-center gap-3 flex-1 min-w-[280px]">
                            <div class="flex items-center shadow-lg">
                                <button onclick="copyRawText('${safeText}', event)" class="bg-cnn-orange hover:bg-cnn-orangeHover text-white font-bold px-5 py-2.5 rounded-l-lg transition-colors flex items-center gap-2">
                                    ${escapeHTML(c.code)}
                                </button>
                                <button onclick="toggleSpoilerRow(${c.id})" class="bg-[#26262e] hover:bg-gray-700 text-gray-300 px-4 py-2.5 rounded-r-lg border-l border-[#121214] text-xs font-medium transition-colors flex items-center">
                                    Текст <i data-lucide="chevron-down" class="w-3 h-3 ml-1.5"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Правая часть -->
                        <div class="flex items-center gap-1">
                            <button onclick="copyRawText('${safeCode}', event)" class="p-2 w-9 h-9 flex items-center justify-center text-gray-400 hover:text-white hover:bg-gray-800 rounded-lg transition-colors" title="Скопировать кодовое слово">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                            </button>
                            <button onclick="deleteContractRow(${c.id})" class="p-2 w-9 h-9 flex items-center justify-center text-red-500 hover:text-red-400 hover:bg-red-950/50 rounded-lg transition-colors" title="Удалить контракт">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div id="spoiler-${c.id}" class="spoiler-content border-t border-cnn-border bg-[#121214] p-5 text-gray-300 text-sm whitespace-pre-wrap leading-relaxed">${escapeHTML(c.text)}</div>
                </div>`;
            });

            container.innerHTML = html;
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function escapeHTML(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // --- ИМПОРТ ИЗ GOOGLE ТАБЛИЦ ---
        function toggleImportModal() {
            const modal = document.getElementById('import-modal');
            modal.classList.toggle('hidden');
        }

        async function startImport() {
            const urlInput = document.getElementById('sheet-url').value.trim();
            if (!urlInput) return alert('Введите ссылку на таблицу');

            const btn = document.getElementById('import-btn');
            const originalBtnHTML = btn.innerHTML;
            btn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Загрузка...';
            if (typeof lucide !== 'undefined') lucide.createIcons();
            btn.disabled = true;

            try {
                // Извлекаем ID таблицы
                const match = urlInput.match(/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
                if (!match) throw new Error('Не удалось найти ID таблицы в ссылке');
                const sheetId = match[1];

                // Извлекаем ID конкретного листа (gid), если есть
                const gidMatch = urlInput.match(/gid=([0-9]+)/);
                const gid = gidMatch ? gidMatch[1] : '0';

                // Создаем ссылку для экспорта в формате TSV (Tab-Separated Values - надежнее всего для текста)
                const exportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=tsv&gid=${gid}`;

                const response = await fetch(exportUrl);
                if (!response.ok) throw new Error('Нет доступа. Убедитесь, что таблица доступна "Всем у кого есть ссылка"');
                const text = await response.text();

                // Парсим TSV с учетом многострочного текста
                const rows = parseTSV(text);
                let db = getSavedContracts();
                let importedCount = 0;

                // Пропускаем первую строку (обычно там заголовки)
                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i];
                    if (row.length >= 15) { // Проверяем, что есть хотя бы 15 колонок (до O)
                        const code = row[1] ? row[1].trim() : '';     // Индекс 1 = Столбец B
                        const adText = row[14] ? row[14].trim() : ''; // Индекс 14 = Столбец O
                        
                        if (code && adText) {
                            // Проверяем, нет ли уже такого контракта, чтобы не дублировать
                            const exists = db.some(c => c.code.toLowerCase() === code.toLowerCase() && c.text === adText);
                            if (!exists) {
                                db.push({ id: Date.now() + importedCount, code: code, text: adText });
                                importedCount++;
                            }
                        }
                    }
                }

                saveContractsDb(db);
                alert(`Импорт завершен! Добавлено новых контрактов: ${importedCount}`);
                document.getElementById('sheet-url').value = '';
                toggleImportModal();

            } catch (error) {
                alert(`Ошибка загрузки: ${error.message}`);
                console.error(error);
            } finally {
                btn.innerHTML = originalBtnHTML;
                btn.disabled = false;
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        // Функция парсинга формата TSV с учетом ячеек с переносами строк
        function parseTSV(str) {
            var arr = [];
            var quote = false;
            var row = 0, col = 0;
            for (var c = 0; c < str.length; c++) {
                var cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == '\t' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr;
        }
    </script>
</body>
</html>
